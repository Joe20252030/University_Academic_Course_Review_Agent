[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uacragent"
version = "0.3.2"
description = "University Academic Course Review Agent — conversational course assistant for grounded study help and exam preparation"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["rag", "llm", "education", "study-assistant", "desktop-app", "tkinter", "gemini", "openai", "deepseek", "langchain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["dependencies"]

[project.urls]
"Homepage"   = "https://joe20252030.github.io/University_Academic_Course_Review_Agent/"
"Repository" = "https://github.com/Joe20252030/University_Academic_Course_Review_Agent"
"Changelog"  = "https://github.com/Joe20252030/University_Academic_Course_Review_Agent/blob/main/CHANGELOG.md"

[project.scripts]
uacragent = "uacragent.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"uacragent" = [
    "agent/prompts/*.md",
    "assets/*.png",
    "assets/*.ico",
    "assets/*.icns",
    "assets/*.svg",
]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
